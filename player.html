<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>حروف — اللاعب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a12;
    --card: #13131f;
    --border: #2a2a40;
    --gold: #f5c842;
    --team-a: #3b82f6;
    --team-b: #ef4444;
    --text: #e8e8f0;
    --muted: #6b6b8a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* SCREENS */
  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 24px;
  }
  .screen.active { display: flex; }

  /* JOIN SCREEN */
  .logo {
    font-size: 3.5rem;
    font-weight: 900;
    letter-spacing: -2px;
    background: linear-gradient(135deg, var(--team-a), var(--gold), var(--team-b));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  .tagline {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 40px;
  }

  .input-group {
    width: 100%;
    max-width: 340px;
    margin-bottom: 16px;
  }
  .input-label {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 1px;
    margin-bottom: 8px;
    display: block;
  }
  .input-field {
    width: 100%;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    font-family: 'Tajawal', sans-serif;
    font-size: 1rem;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .input-field:focus { border-color: var(--gold); }

  .team-selector {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
    max-width: 340px;
    margin-bottom: 32px;
  }
  .team-btn {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 16px 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
  }
  .team-btn.selected-a { 
    border-color: var(--team-a); 
    background: rgba(59,130,246,0.15); 
    color: var(--team-a);
    transform: scale(1.02);
  }
  .team-btn.selected-b { 
    border-color: var(--team-b); 
    background: rgba(239,68,68,0.15); 
    color: var(--team-b);
    transform: scale(1.02);
  }

  .btn-join {
    background: linear-gradient(135deg, var(--gold), #e6b800);
    border: none;
    color: #0a0a12;
    font-family: 'Tajawal', sans-serif;
    font-size: 1.2rem;
    font-weight: 900;
    padding: 16px 40px;
    border-radius: 16px;
    cursor: pointer;
    width: 100%;
    max-width: 340px;
    transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(245,200,66,0.3);
  }
  .btn-join:hover { transform: scale(1.02); }
  .btn-join:active { transform: scale(0.97); }

  /* GAME SCREEN */
  .game-header {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 400px;
    margin-bottom: 20px;
  }
  .g-score {
    text-align: center;
    flex: 1;
  }
  .g-score-label {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--muted);
  }
  .g-score-num {
    font-size: 2rem;
    font-weight: 900;
  }
  .score-a { color: var(--team-a); }
  .score-b { color: var(--team-b); }

  .player-info {
    text-align: center;
    margin-bottom: 40px;
  }
  .player-name-display {
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .player-team-badge {
    display: inline-block;
    padding: 4px 16px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 700;
  }
  .badge-a { background: rgba(59,130,246,0.2); color: var(--team-a); border: 1px solid var(--team-a); }
  .badge-b { background: rgba(239,68,68,0.2); color: var(--team-b); border: 1px solid var(--team-b); }

  /* THE BUZZ BUTTON */
  .buzz-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    width: 100%;
    max-width: 340px;
  }

  #buzzBtn {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    font-weight: 900;
    font-size: 1.8rem;
    transition: all 0.15s;
    position: relative;
    user-select: none;
  }

  #buzzBtn.ready-a {
    background: radial-gradient(circle at 35% 35%, #60a5fa, var(--team-a));
    color: white;
    box-shadow: 0 8px 40px rgba(59,130,246,0.5), 0 0 0 6px rgba(59,130,246,0.15);
  }
  #buzzBtn.ready-b {
    background: radial-gradient(circle at 35% 35%, #f87171, var(--team-b));
    color: white;
    box-shadow: 0 8px 40px rgba(239,68,68,0.5), 0 0 0 6px rgba(239,68,68,0.15);
  }
  #buzzBtn.blocked {
    background: radial-gradient(circle at 35% 35%, #374151, #1f2937);
    color: var(--muted);
    cursor: not-allowed;
    box-shadow: none;
    transform: scale(0.95) !important;
  }
  #buzzBtn.winner {
    background: radial-gradient(circle at 35% 35%, #fde68a, var(--gold));
    color: #0a0a12;
    box-shadow: 0 8px 40px rgba(245,200,66,0.6), 0 0 0 8px rgba(245,200,66,0.2);
    animation: winner-pulse 1s infinite;
  }
  @keyframes winner-pulse {
    0%, 100% { box-shadow: 0 8px 40px rgba(245,200,66,0.6), 0 0 0 8px rgba(245,200,66,0.2); }
    50% { box-shadow: 0 8px 60px rgba(245,200,66,0.9), 0 0 0 16px rgba(245,200,66,0.1); }
  }

  #buzzBtn:not(.blocked):not(.winner):active {
    transform: scale(0.93) !important;
    box-shadow: 0 2px 20px rgba(0,0,0,0.5) !important;
  }

  .buzz-status {
    text-align: center;
    font-size: 1rem;
    color: var(--muted);
    min-height: 24px;
    font-weight: 700;
    transition: color 0.3s;
  }
  .buzz-status.status-winner { color: var(--gold); font-size: 1.1rem; }
  .buzz-status.status-blocked { color: #ef4444; }

  /* COUNTDOWN on player */
  .player-countdown {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .player-countdown.show { display: flex; }
  .player-cd-ring { position: relative; width: 64px; height: 64px; }
  .player-cd-ring svg { transform: rotate(-90deg); }
  .player-cd-ring circle { fill: none; stroke-width: 5; }
  .pring-bg { stroke: var(--border); }
  .pring-prog {
    stroke: var(--gold); stroke-linecap: round;
    stroke-dasharray: 175; stroke-dashoffset: 0;
    transition: stroke-dashoffset 0.1s linear, stroke 0.3s;
  }
  .pring-prog.urgent { stroke: #ef4444; }
  .player-cd-num {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; font-weight: 900; color: var(--gold);
  }
  .player-cd-num.urgent { color: #ef4444; }
  .player-cd-label { font-size: 0.75rem; color: var(--muted); font-weight: 700; letter-spacing: 1px; }

  /* Status dot */
  .conn-status {
    position: fixed;
    top: 12px;
    left: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .conn-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #ef4444;
  }
  .conn-dot.on { background: #22c55e; animation: blink 2s infinite; }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
</style>
</head>
<body>

<div class="conn-status">
  <div class="conn-dot" id="connDot"></div>
  <span id="connText">جاري الاتصال</span>
</div>

<!-- JOIN SCREEN -->
<div class="screen active" id="joinScreen">
  <div class="logo">حروف</div>
  <div class="tagline">لعبة الأسئلة التفاعلية</div>

  <div class="input-group">
    <label class="input-label">اسمك</label>
    <input type="text" class="input-field" id="playerName" placeholder="اكتب اسمك هنا..." maxlength="20">
  </div>

  <div style="width:100%;max-width:340px;margin-bottom:12px;">
    <label class="input-label">اختر فريقك</label>
  </div>
  <div class="team-selector">
    <button class="team-btn" id="btnTeamA" onclick="selectTeam('A')">
      🔵<br>الفريق أ
    </button>
    <button class="team-btn" id="btnTeamB" onclick="selectTeam('B')">
      🔴<br>الفريق ب
    </button>
  </div>

  <button class="btn-join" onclick="joinGame()">انضم للعبة ⚡</button>
  <div id="joinError" style="color:#ef4444;font-size:0.85rem;margin-top:12px;text-align:center;"></div>
</div>

<!-- GAME SCREEN -->
<div class="screen" id="gameScreen">
  <div class="game-header">
    <div class="g-score">
      <div class="g-score-label">الفريق أ</div>
      <div class="g-score-num score-a" id="gScoreA">0</div>
    </div>
    <div style="flex:0;padding:0 16px;display:flex;align-items:center;">
      <span style="color:var(--muted);font-size:1.5rem;">⚡</span>
    </div>
    <div class="g-score">
      <div class="g-score-label">الفريق ب</div>
      <div class="g-score-num score-b" id="gScoreB">0</div>
    </div>
  </div>

  <div class="player-info">
    <div class="player-name-display" id="displayName"></div>
    <div class="player-team-badge" id="displayTeam"></div>
  </div>

  <div class="buzz-container">
    <button id="buzzBtn" class="ready-a" onclick="buzz()">
      اضغط!
    </button>
    <div class="buzz-status" id="buzzStatus">جاهز للإجابة؟</div>
    <div class="player-countdown" id="playerCountdown">
      <div class="player-cd-label">وقت الإجابة</div>
      <div class="player-cd-ring">
        <svg width="64" height="64" viewBox="0 0 64 64">
          <circle class="pring-bg" cx="32" cy="32" r="28"/>
          <circle class="pring-prog" id="pRingProg" cx="32" cy="32" r="28"/>
        </svg>
        <div class="player-cd-num" id="pCdNum">3</div>
      </div>
    </div>
  </div>
</div>

<script>
  const WS_URL = location.protocol === 'https:'
    ? `wss://${location.host}`
    : `ws://${location.host}`;

  let ws;
  let myTeam = null;
  let myName = '';
  let myId = null;
  let gameBlocked = false;
  let cdInterval = null;
  const CD_SECS = 3;
  const P_CIRC = 175; // 2π*28

  // ─── SOUND ───────────────────────────────────────────────────
  let audioCtx;
  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function playBuzzSound() {
    try {
      const ctx = getCtx();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'square';
      o.frequency.setValueAtTime(900, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.35);
      g.gain.setValueAtTime(0.35, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      o.start(); o.stop(ctx.currentTime + 0.4);
    } catch(e) {}
  }

  function playTickSound(n) {
    try {
      const ctx = getCtx();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine';
      o.frequency.value = n === 1 ? 1200 : 880;
      g.gain.setValueAtTime(0.15, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
      o.start(); o.stop(ctx.currentTime + 0.08);
    } catch(e) {}
  }

  function playTimeupSound() {
    try {
      const ctx = getCtx();
      [400, 300, 200].forEach((freq, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sawtooth';
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.12);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.1);
        o.start(ctx.currentTime + i * 0.12);
        o.stop(ctx.currentTime + i * 0.12 + 0.1);
      });
    } catch(e) {}
  }

  // ─── COUNTDOWN ───────────────────────────────────────────────
  function startPlayerCountdown() {
    stopPlayerCountdown();
    let rem = CD_SECS;
    document.getElementById('playerCountdown').classList.add('show');
    updatePCD(rem);
    cdInterval = setInterval(() => {
      rem -= 1;
      if (rem <= 0) {
        stopPlayerCountdown();
        playTimeupSound();
        updatePCD(0);
      } else {
        updatePCD(rem);
        playTickSound(rem);
      }
    }, 1000);
  }

  function stopPlayerCountdown() {
    if (cdInterval) { clearInterval(cdInterval); cdInterval = null; }
    document.getElementById('playerCountdown').classList.remove('show');
  }

  function updatePCD(n) {
    const num = document.getElementById('pCdNum');
    const ring = document.getElementById('pRingProg');
    ring.style.strokeDashoffset = P_CIRC * (1 - n / CD_SECS);
    num.textContent = n;
    const urgent = n <= 1;
    num.classList.toggle('urgent', urgent);
    ring.classList.toggle('urgent', urgent);
  }

  // ─── GAME ─────────────────────────────────────────────────────
  function selectTeam(team) {
    myTeam = team;
    document.getElementById('btnTeamA').className = team === 'A' ? 'team-btn selected-a' : 'team-btn';
    document.getElementById('btnTeamB').className = team === 'B' ? 'team-btn selected-b' : 'team-btn';
  }

  function joinGame() {
    const name = document.getElementById('playerName').value.trim();
    const err = document.getElementById('joinError');
    if (!name) { err.textContent = 'اكتب اسمك أول'; return; }
    if (!myTeam) { err.textContent = 'اختر فريقك'; return; }
    err.textContent = '';
    myName = name;
    if (!ws || ws.readyState !== WebSocket.OPEN) { err.textContent = 'لم يتصل بعد، انتظر...'; return; }
    ws.send(JSON.stringify({ type: 'join_player', name, team: myTeam }));
  }

  function buzz() {
    if (gameBlocked) return;
    ws.send(JSON.stringify({ type: 'buzz' }));
    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
  }

  function connect() {
    ws = new WebSocket(WS_URL);
    ws.onopen = () => {
      document.getElementById('connDot').classList.add('on');
      document.getElementById('connText').textContent = 'متصل';
    };
    ws.onclose = () => {
      document.getElementById('connDot').classList.remove('on');
      document.getElementById('connText').textContent = 'انقطع';
      setTimeout(connect, 2000);
    };
    ws.onmessage = (e) => { handleMessage(JSON.parse(e.data)); };
  }

  function handleMessage(msg) {
    switch(msg.type) {
      case 'joined':
        myId = msg.id; myTeam = msg.team;
        document.getElementById('displayName').textContent = msg.name;
        const badge = document.getElementById('displayTeam');
        badge.textContent = msg.team === 'A' ? 'الفريق أ 🔵' : 'الفريق ب 🔴';
        badge.className = 'player-team-badge ' + (msg.team === 'A' ? 'badge-a' : 'badge-b');
        document.getElementById('buzzBtn').className = myTeam === 'A' ? 'ready-a' : 'ready-b';
        document.getElementById('joinScreen').classList.remove('active');
        document.getElementById('gameScreen').classList.add('active');
        if (msg.blocked) setBlocked(msg.buzzer);
        break;
      case 'buzz_event':
        const isMe = msg.buzzer.id === myId;
        if (isMe) { setWinner(); startPlayerCountdown(); }
        else { setBlocked(msg.buzzer); startPlayerCountdown(); }
        playBuzzSound();
        break;
      case 'buzz_denied':
        if (navigator.vibrate) navigator.vibrate(200);
        break;
      case 'reset':
        setReady();
        stopPlayerCountdown();
        break;
      case 'score_update':
        document.getElementById('gScoreA').textContent = msg.scores.A;
        document.getElementById('gScoreB').textContent = msg.scores.B;
        break;
    }
  }

  function setReady() {
    gameBlocked = false;
    const btn = document.getElementById('buzzBtn');
    btn.className = myTeam === 'A' ? 'ready-a' : 'ready-b';
    btn.textContent = 'اضغط!';
    const st = document.getElementById('buzzStatus');
    st.textContent = 'جاهز للإجابة؟';
    st.className = 'buzz-status';
  }

  function setBlocked(buzzer) {
    gameBlocked = true;
    document.getElementById('buzzBtn').className = 'blocked';
    document.getElementById('buzzBtn').textContent = '🔒';
    const st = document.getElementById('buzzStatus');
    st.textContent = buzzer ? `ضغط: ${buzzer.name}` : 'محجوب';
    st.className = 'buzz-status status-blocked';
  }

  function setWinner() {
    gameBlocked = true;
    document.getElementById('buzzBtn').className = 'winner';
    document.getElementById('buzzBtn').textContent = '🎉 أنت الأول!';
    const st = document.getElementById('buzzStatus');
    st.textContent = '⭐ أجب الآن!';
    st.className = 'buzz-status status-winner';
    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 300]);
  }

  window.onload = () => { connect(); };
</script>
</body>
</html>
