<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أداة الزر — دخول</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#0a0a12;--card:#13131f;--border:#2a2a40;--gold:#f5c842;--a:#3b82f6;--b:#ef4444;--text:#e8e8f0;--muted:#6b6b8a;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background-image:radial-gradient(ellipse at 20% 0%,rgba(59,130,246,.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(239,68,68,.08) 0%,transparent 50%);}
.card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:32px 28px;width:100%;max-width:400px;}
.logo{font-size:2.6rem;font-weight:900;letter-spacing:-2px;background:linear-gradient(135deg,var(--a),var(--gold),var(--b));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:4px;}
.tagline{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:24px;}

/* Method tabs */
.methods{display:grid;grid-template-columns:1fr 1fr 1fr;background:rgba(255,255,255,.04);border-radius:12px;padding:4px;margin-bottom:24px;gap:3px;}
.method-tab{padding:9px 4px;text-align:center;border-radius:9px;cursor:pointer;font-weight:700;font-size:.78rem;color:var(--muted);transition:all .2s;}
.method-tab.active{background:var(--card);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3);}

/* Forms */
.form-section{display:none;} .form-section.active{display:block;}
.fgroup{margin-bottom:14px;}
label{display:block;font-size:.75rem;font-weight:700;color:var(--muted);letter-spacing:1px;margin-bottom:5px;}
input{width:100%;background:rgba(255,255,255,.05);border:2px solid var(--border);border-radius:11px;padding:12px 14px;font-family:'Tajawal',sans-serif;font-size:1rem;color:var(--text);outline:none;transition:border-color .2s;}
input:focus{border-color:var(--gold);}
.btn-main{width:100%;background:linear-gradient(135deg,var(--gold),#e6b800);border:none;color:#0a0a12;font-family:'Tajawal',sans-serif;font-size:1.05rem;font-weight:900;padding:13px;border-radius:13px;cursor:pointer;transition:all .2s;margin-top:4px;}
.btn-main:hover{transform:scale(1.01);}
.btn-main:active{transform:scale(.98);}
.btn-main:disabled{opacity:.5;cursor:not-allowed;transform:none;}

/* Sub-tabs for email (login/register) */
.sub-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:18px;}
.sub-tab{background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Tajawal',sans-serif;font-size:.85rem;font-weight:700;padding:8px;border-radius:9px;cursor:pointer;transition:all .2s;}
.sub-tab.active{border-color:var(--gold);color:var(--gold);background:rgba(245,200,66,.08);}

/* OTP row */
.otp-row{display:grid;grid-template-columns:1fr auto;gap:8px;}
.btn-send-otp{background:transparent;border:2px solid var(--border);color:var(--muted);font-family:'Tajawal',sans-serif;font-size:.82rem;font-weight:700;padding:12px 14px;border-radius:11px;cursor:pointer;white-space:nowrap;transition:all .2s;}
.btn-send-otp:not(:disabled):hover{border-color:var(--gold);color:var(--gold);}
.btn-send-otp:disabled{opacity:.5;cursor:not-allowed;}

/* Google */
.google-wrapper{display:flex;justify-content:center;margin-bottom:4px;}
.google-note{text-align:center;color:var(--muted);font-size:.78rem;margin-top:10px;}

.err{color:#ef4444;font-size:.82rem;text-align:center;margin-top:10px;min-height:18px;}
.success-note{color:#22c55e;font-size:.82rem;text-align:center;margin-top:6px;}

.divider{display:flex;align-items:center;gap:10px;margin:18px 0;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
.divider span{color:var(--muted);font-size:.78rem;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">أداة الزر</div>
  <div class="tagline">سجّل دخولك للبدء كهوست</div>

  <!-- Method selector -->
  <div class="methods">
    <div class="method-tab active" onclick="switchMethod('email')">📧 إيميل</div>
    <div class="method-tab" onclick="switchMethod('phone')">📱 جوال</div>
    <div class="method-tab" onclick="switchMethod('google')">Google</div>
  </div>

  <!-- ─── Email ─── -->
  <div class="form-section active" id="sec-email">
    <div class="sub-tabs">
      <button class="sub-tab active" onclick="switchEmailTab('login')">تسجيل الدخول</button>
      <button class="sub-tab" onclick="switchEmailTab('register')">حساب جديد</button>
    </div>
    <div id="email-login">
      <div class="fgroup"><label>البريد الإلكتروني</label><input type="email" id="eLoginEmail" placeholder="name@email.com"></div>
      <div class="fgroup"><label>كلمة المرور</label><input type="password" id="eLoginPw" placeholder="••••••••" onkeydown="if(event.key==='Enter')doEmailLogin()"></div>
      <button class="btn-main" onclick="doEmailLogin()">دخول ←</button>
    </div>
    <div id="email-register" style="display:none">
      <div class="fgroup"><label>الاسم</label><input type="text" id="eRegName" placeholder="اسمك"></div>
      <div class="fgroup"><label>البريد الإلكتروني</label><input type="email" id="eRegEmail" placeholder="name@email.com"></div>
      <div class="fgroup"><label>كلمة المرور</label><input type="password" id="eRegPw" placeholder="٦ أحرف على الأقل" onkeydown="if(event.key==='Enter')doEmailRegister()"></div>
      <button class="btn-main" onclick="doEmailRegister()">إنشاء حساب ←</button>
    </div>
  </div>

  <!-- ─── Phone ─── -->
  <div class="form-section" id="sec-phone">
    <div id="phone-step1">
      <div class="fgroup">
        <label>رقم الجوال (السعودية)</label>
        <div class="otp-row">
          <input type="tel" id="phoneNum" placeholder="05xxxxxxxx">
          <button class="btn-send-otp" id="btnSendOtp" onclick="sendOTP()">إرسال رمز</button>
        </div>
      </div>
      <div class="success-note" id="otpSentNote" style="display:none">✅ تم الإرسال — تحقق من رسائلك</div>
    </div>
    <div id="phone-step2" style="display:none">
      <div class="fgroup">
        <label>رمز التحقق (6 أرقام)</label>
        <input type="text" id="otpCode" placeholder="123456" maxlength="6" inputmode="numeric" onkeydown="if(event.key==='Enter')verifyOTP()">
      </div>
      <button class="btn-main" onclick="verifyOTP()">تحقق والدخول ←</button>
      <div style="text-align:center;margin-top:10px;">
        <button style="background:none;border:none;color:var(--muted);font-family:'Tajawal',sans-serif;font-size:.82rem;cursor:pointer;" onclick="document.getElementById('phone-step2').style.display='none';document.getElementById('phone-step1').style.display='block'">← تغيير الرقم</button>
      </div>
    </div>
  </div>

  <!-- ─── Google ─── -->
  <div class="form-section" id="sec-google">
    <div style="margin-bottom:16px;color:var(--muted);font-size:.88rem;text-align:center;">سجّل الدخول بحسابك على Google بضغطة واحدة</div>
    <div class="google-wrapper">
      <div id="g_id_onload"
        data-client_id="YOUR_GOOGLE_CLIENT_ID"
        data-callback="handleGoogleCredential"
        data-auto_prompt="false">
      </div>
      <div class="g_id_signin"
        data-type="standard"
        data-size="large"
        data-theme="filled_black"
        data-text="signin_with"
        data-shape="rectangular"
        data-locale="ar"
        data-logo_alignment="left">
      </div>
    </div>
    <div class="google-note">ستُعيَّن نفس باقتك على حسابك الموجود إذا كان البريد مطابقاً</div>
  </div>

  <div class="err" id="errMsg"></div>
</div>

<script>
const tabs = document.querySelectorAll('.method-tab');
function switchMethod(m) {
  tabs.forEach((t,i)=>t.classList.toggle('active',['email','phone','google'][i]===m));
  ['email','phone','google'].forEach(x=>document.getElementById('sec-'+x).classList.toggle('active',x===m));
  document.getElementById('errMsg').textContent='';
}

const eTabs = document.querySelectorAll('.sub-tab');
function switchEmailTab(t) {
  eTabs.forEach((el,i)=>el.classList.toggle('active',['login','register'][i]===t));
  document.getElementById('email-login').style.display = t==='login'?'':'none';
  document.getElementById('email-register').style.display = t==='register'?'':'none';
  document.getElementById('errMsg').textContent='';
}

function setErr(msg){document.getElementById('errMsg').textContent=msg;}
function done(){window.location.href='/host.html';}

async function doEmailLogin(){
  const email=document.getElementById('eLoginEmail').value.trim();
  const password=document.getElementById('eLoginPw').value;
  if(!email||!password){setErr('أكمل البيانات');return;}
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  const d=await r.json();
  if(d.error){setErr(d.error);}else done();
}

async function doEmailRegister(){
  const name=document.getElementById('eRegName').value.trim();
  const email=document.getElementById('eRegEmail').value.trim();
  const password=document.getElementById('eRegPw').value;
  if(!name||!email||!password){setErr('أكمل البيانات');return;}
  const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,password})});
  const d=await r.json();
  if(d.error){setErr(d.error);}else done();
}

let otpPhone='';
async function sendOTP(){
  const phone=document.getElementById('phoneNum').value.trim();
  if(!phone){setErr('أدخل رقم الجوال');return;}
  const btn=document.getElementById('btnSendOtp');
  btn.disabled=true; btn.textContent='جاري...';
  const r=await fetch('/api/otp/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone})});
  const d=await r.json();
  if(d.error){setErr(d.error);btn.disabled=false;btn.textContent='إرسال رمز';return;}
  otpPhone=d.phone;
  document.getElementById('otpSentNote').style.display='block';
  // Dev mode: show code
  if(d.dev_code){setErr('⚠️ وضع التطوير — الرمز: '+d.dev_code);}
  setTimeout(()=>{
    document.getElementById('phone-step1').style.display='none';
    document.getElementById('phone-step2').style.display='block';
  },1000);
  // Countdown
  let s=60; const interval=setInterval(()=>{ s--; btn.textContent=s+'s'; if(s<=0){clearInterval(interval);btn.disabled=false;btn.textContent='إعادة إرسال';}},1000);
}

async function verifyOTP(){
  const code=document.getElementById('otpCode').value.trim();
  if(!code){setErr('أدخل الرمز');return;}
  const r=await fetch('/api/otp/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:otpPhone,code})});
  const d=await r.json();
  if(d.error){setErr(d.error);}else done();
}

async function handleGoogleCredential(response){
  const r=await fetch('/api/google',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:response.credential})});
  const d=await r.json();
  if(d.error){setErr(d.error);}else done();
}
</script>
</body>
</html>
