<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>أداة الزر — اللاعب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0a12; --card:#13131f; --border:#2a2a40;
  --gold:#f5c842; --team-a:#3b82f6; --team-b:#ef4444;
  --text:#e8e8f0; --muted:#6b6b8a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;display:flex;flex-direction:column;}

.screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:24px;}
.screen.active{display:flex;}
#gameScreen{position:fixed;inset:0;overflow:hidden;padding:20px;height:100dvh;min-height:unset;}

.logo{font-size:3.5rem;font-weight:900;letter-spacing:-2px;background:linear-gradient(135deg,var(--team-a),var(--gold),var(--team-b));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;}
.tagline{color:var(--muted);font-size:.9rem;margin-bottom:36px;}

.input-group{width:100%;max-width:340px;margin-bottom:14px;}
.input-label{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:1px;margin-bottom:6px;display:block;}
.input-field{width:100%;background:var(--card);border:2px solid var(--border);border-radius:12px;padding:13px 15px;font-family:'Tajawal',sans-serif;font-size:1rem;color:var(--text);outline:none;transition:border-color .2s;}
.input-field:focus{border-color:var(--gold);}

.team-selector{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:340px;margin-bottom:28px;}
.team-btn{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;transition:all .2s;color:var(--text);font-family:'Tajawal',sans-serif;font-size:.95rem;font-weight:700;}
.team-btn.selected-a{border-color:var(--team-a);background:rgba(59,130,246,.15);color:var(--team-a);}
.team-btn.selected-b{border-color:var(--team-b);background:rgba(239,68,68,.15);color:var(--team-b);}

.btn-join{background:linear-gradient(135deg,var(--gold),#e6b800);border:none;color:#0a0a12;font-family:'Tajawal',sans-serif;font-size:1.2rem;font-weight:900;padding:15px 40px;border-radius:16px;cursor:pointer;width:100%;max-width:340px;transition:all .2s;box-shadow:0 4px 18px rgba(245,200,66,.3);}
.btn-join:hover{transform:scale(1.02);}
.btn-join:active{transform:scale(.97);}

/* game */
.player-info{text-align:center;margin-bottom:20px;}
.player-name-display{font-size:1.2rem;font-weight:700;margin-bottom:4px;}
.player-team-badge{display:inline-block;padding:3px 14px;border-radius:20px;font-size:.85rem;font-weight:700;}
.badge-a{background:rgba(59,130,246,.2);color:var(--team-a);border:1px solid var(--team-a);}
.badge-b{background:rgba(239,68,68,.2);color:var(--team-b);border:1px solid var(--team-b);}

.buzz-container{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:340px;}

#buzzBtn{width:210px;height:210px;border-radius:50%;border:none;cursor:pointer;font-family:'Tajawal',sans-serif;font-weight:900;font-size:1.7rem;transition:all .15s;user-select:none;}
#buzzBtn.ready-a{background:radial-gradient(circle at 35% 35%,#60a5fa,var(--team-a));color:white;box-shadow:0 8px 40px rgba(59,130,246,.5),0 0 0 6px rgba(59,130,246,.15);}
#buzzBtn.ready-b{background:radial-gradient(circle at 35% 35%,#f87171,var(--team-b));color:white;box-shadow:0 8px 40px rgba(239,68,68,.5),0 0 0 6px rgba(239,68,68,.15);}
#buzzBtn.blocked{background:radial-gradient(circle at 35% 35%,#374151,#1f2937);color:var(--muted);cursor:not-allowed;box-shadow:none;transform:scale(.95)!important;}
#buzzBtn.advantage-active{background:radial-gradient(circle at 35% 35%,#c084fc,#a855f7);color:white;box-shadow:0 8px 40px rgba(168,85,247,.5),0 0 0 6px rgba(168,85,247,.15);animation:adv-pulse 1s infinite;}
#buzzBtn.winner{background:radial-gradient(circle at 35% 35%,#fde68a,var(--gold));color:#0a0a12;box-shadow:0 8px 40px rgba(245,200,66,.6),0 0 0 8px rgba(245,200,66,.2);animation:winner-pulse 1s infinite;}
@keyframes winner-pulse{0%,100%{box-shadow:0 8px 40px rgba(245,200,66,.6),0 0 0 8px rgba(245,200,66,.2)}50%{box-shadow:0 8px 60px rgba(245,200,66,.9),0 0 0 16px rgba(245,200,66,.1)}}
@keyframes adv-pulse{0%,100%{box-shadow:0 8px 40px rgba(168,85,247,.5),0 0 0 6px rgba(168,85,247,.15)}50%{box-shadow:0 8px 60px rgba(168,85,247,.8),0 0 0 14px rgba(168,85,247,.1)}}
#buzzBtn:not(.blocked):not(.winner):not(.advantage-active):active{transform:scale(.93)!important;box-shadow:0 2px 20px rgba(0,0,0,.5)!important;}

.buzz-status{text-align:center;font-size:1rem;color:var(--muted);min-height:22px;font-weight:700;transition:color .3s;}
.buzz-status.winner{color:var(--gold);}
.buzz-status.blocked{color:#ef4444;}
.buzz-status.advantage{color:#a855f7;}

/* player countdown */
.p-cd{display:none;flex-direction:column;align-items:center;gap:5px;}
.p-cd.show{display:flex;}
.p-cd-label{font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:1px;}
.p-cd-ring{position:relative;width:56px;height:56px;}
.p-cd-ring svg{transform:rotate(-90deg);}
.p-cd-ring circle{fill:none;stroke-width:5;}
.pring-bg{stroke:var(--border);}
.pring-prog{stroke:var(--gold);stroke-linecap:round;stroke-dasharray:157;stroke-dashoffset:0;transition:stroke-dashoffset .1s linear,stroke .3s;}
.pring-prog.urgent{stroke:#ef4444;}
.p-cd-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:900;color:var(--gold);}
.p-cd-num.urgent{color:#ef4444;}

/* adv player countdown (purple) */
.adv-pring-prog{stroke:#a855f7;stroke-linecap:round;stroke-dasharray:157;stroke-dashoffset:0;transition:stroke-dashoffset .1s linear;}
.adv-p-cd-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:900;color:#a855f7;}

.conn-status{position:fixed;top:12px;left:12px;display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);}
.conn-dot{width:7px;height:7px;border-radius:50%;background:#ef4444;}
.conn-dot.on{background:#22c55e;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

/* lobby screen */
.lobby-teams{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:360px;margin-bottom:28px;}
.lobby-col{background:var(--card);border:2px solid var(--border);border-radius:16px;padding:14px;}
.lobby-col.team-a{border-color:rgba(59,130,246,.35);}
.lobby-col.team-b{border-color:rgba(239,68,68,.35);}
.lobby-col-title{font-size:.72rem;font-weight:700;letter-spacing:2px;margin-bottom:10px;}
.lobby-col.team-a .lobby-col-title{color:var(--team-a);}
.lobby-col.team-b .lobby-col-title{color:var(--team-b);}
.lobby-player{display:flex;align-items:center;gap:7px;padding:6px 8px;background:rgba(255,255,255,.04);border-radius:7px;margin-bottom:5px;font-size:.88rem;}
.lobby-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.lobby-empty{color:var(--muted);font-size:.78rem;text-align:center;padding:8px;}
.btn-next{background:linear-gradient(135deg,var(--gold),#e6b800);border:none;color:#0a0a12;font-family:'Tajawal',sans-serif;font-size:1.1rem;font-weight:900;padding:14px 36px;border-radius:14px;cursor:pointer;width:100%;max-width:340px;transition:all .2s;box-shadow:0 4px 18px rgba(245,200,66,.3);}
.btn-next:hover{transform:scale(1.02);}
.btn-next:active{transform:scale(.97);}
.live-badge{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;color:var(--muted);margin-bottom:16px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;animation:blink 1.5s infinite;}

/* kicked screen */
#kickedScreen { background:var(--bg); }
.kicked-icon{font-size:4rem;margin-bottom:16px;}
.kicked-title{font-size:1.8rem;font-weight:900;color:#ef4444;margin-bottom:8px;}
.kicked-sub{color:var(--muted);font-size:1rem;}
</style>
</head>
<body>

<div class="conn-status">
  <div class="conn-dot" id="connDot"></div>
  <span id="connText">جاري الاتصال</span>
</div>

<!-- NAME SCREEN -->
<div class="screen active" id="joinScreen">
  <div class="logo">أداة الزر</div>
  <div class="tagline">لعبة الأسئلة التفاعلية</div>
  <div class="input-group">
    <label class="input-label">اسمك</label>
    <input type="text" class="input-field" id="playerName" placeholder="اكتب اسمك هنا..." maxlength="20">
  </div>
  <button class="btn-next" onclick="goToLobby()">التالي ←</button>
  <div id="joinError" style="color:#ef4444;font-size:.85rem;margin-top:10px;text-align:center;"></div>
</div>

<!-- LOBBY SCREEN -->
<div class="screen" id="lobbyScreen">
  <div class="logo" style="font-size:2.4rem;margin-bottom:4px;">أداة الزر</div>
  <div style="color:var(--muted);font-size:.85rem;margin-bottom:6px;" id="lobbyGreet">اهلاً —</div>
  <div class="live-badge"><div class="live-dot"></div> مباشر</div>

  <div class="lobby-teams">
    <div class="lobby-col team-a">
      <div class="lobby-col-title">🔵 الفريق أ</div>
      <div id="lobbyA"><div class="lobby-empty">فاضي</div></div>
    </div>
    <div class="lobby-col team-b">
      <div class="lobby-col-title">🔴 الفريق ب</div>
      <div id="lobbyB"><div class="lobby-empty">فاضي</div></div>
    </div>
  </div>

  <div style="width:100%;max-width:340px;margin-bottom:12px;">
    <label class="input-label">اختر فريقك</label>
  </div>
  <div class="team-selector" style="margin-bottom:24px;">
    <button class="team-btn" id="btnTeamA" onclick="selectTeam('A')">🔵<br>الفريق أ</button>
    <button class="team-btn" id="btnTeamB" onclick="selectTeam('B')">🔴<br>الفريق ب</button>
  </div>
  <button class="btn-join" onclick="joinGame()">انضم للعبة ⚡</button>
  <div id="lobbyError" style="color:#ef4444;font-size:.85rem;margin-top:10px;text-align:center;"></div>
</div>

<!-- GAME -->
<div class="screen" id="gameScreen">
  <div class="player-info">
    <div class="player-name-display" id="displayName"></div>
    <div class="player-team-badge" id="displayTeam"></div>
  </div>
  <div class="buzz-container">
    <button id="buzzBtn" class="ready-a" onclick="buzz()">اضغط!</button>
    <div class="buzz-status" id="buzzStatus">جاهز للإجابة؟</div>

    <!-- normal countdown -->
    <div class="p-cd" id="pCd">
      <div class="p-cd-label">وقت الإجابة</div>
      <div class="p-cd-ring">
        <svg width="56" height="56" viewBox="0 0 56 56">
          <circle class="pring-bg" cx="28" cy="28" r="25"/>
          <circle class="pring-prog" id="pRingProg" cx="28" cy="28" r="25"/>
        </svg>
        <div class="p-cd-num" id="pCdNum">3</div>
      </div>
    </div>

    <!-- advantage countdown -->
    <div class="p-cd" id="advPCd">
      <div class="p-cd-label" style="color:#a855f7;">وقت الأفضلية</div>
      <div class="p-cd-ring">
        <svg width="56" height="56" viewBox="0 0 56 56">
          <circle class="pring-bg" cx="28" cy="28" r="25"/>
          <circle class="adv-pring-prog" id="advPRingProg" cx="28" cy="28" r="25"/>
        </svg>
        <div class="adv-p-cd-num" id="advPCdNum">10</div>
      </div>
    </div>
  </div>
</div>

<!-- KICKED -->
<div class="screen" id="kickedScreen">
  <div class="kicked-icon">🚫</div>
  <div class="kicked-title">تم طردك</div>
  <div class="kicked-sub">الهوست أزالك من اللعبة</div>
</div>

<script>
const WS_URL=location.protocol==='https:'?`wss://${location.host}`:`ws://${location.host}`;
let ws,myTeam=null,myName='',myId=null,gameBlocked=false;
const CD_SECS=3,ADV_SECS=10,PCIRC=157; // 2π*25
let cdInt=null,advCdInt=null,audioCtx;

function getCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playBuzz(){try{const c=getCtx(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='square';o.frequency.setValueAtTime(900,c.currentTime);o.frequency.exponentialRampToValueAtTime(200,c.currentTime+.35);g.gain.setValueAtTime(.35,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.4);o.start();o.stop(c.currentTime+.4);}catch(e){}}
function playTick(n){try{const c=getCtx(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=n===1?1200:880;g.gain.setValueAtTime(.13,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.08);o.start();o.stop(c.currentTime+.08);}catch(e){}}
function playTimeup(){try{const c=getCtx();[400,300,200].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sawtooth';o.frequency.value=f;g.gain.setValueAtTime(.18,c.currentTime+i*.12);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+i*.12+.1);o.start(c.currentTime+i*.12);o.stop(c.currentTime+i*.12+.1);});}catch(e){}}

// normal countdown
function startPCd(){stopAllCd();let r=CD_SECS;document.getElementById('pCd').classList.add('show');updatePCd(r);cdInt=setInterval(()=>{r--;if(r<=0){clearInterval(cdInt);cdInt=null;playTimeup();updatePCd(0);}else{updatePCd(r);playTick(r);}},1000);}
function stopPCd(){if(cdInt){clearInterval(cdInt);cdInt=null;}document.getElementById('pCd').classList.remove('show');}
function updatePCd(n){const num=document.getElementById('pCdNum'),ring=document.getElementById('pRingProg');ring.style.strokeDashoffset=PCIRC*(1-n/CD_SECS);num.textContent=n;const u=n<=1;num.classList.toggle('urgent',u);ring.classList.toggle('urgent',u);}

// advantage countdown
function startAdvPCd(){stopAllCd();let r=ADV_SECS;document.getElementById('advPCd').classList.add('show');updateAdvPCd(r);advCdInt=setInterval(()=>{r--;if(r<=0){clearInterval(advCdInt);advCdInt=null;updateAdvPCd(0);}else{updateAdvPCd(r);if(r<=3)playTick(r);}},1000);}
function stopAdvPCd(){if(advCdInt){clearInterval(advCdInt);advCdInt=null;}document.getElementById('advPCd').classList.remove('show');}
function updateAdvPCd(n){document.getElementById('advPCdNum').textContent=n;document.getElementById('advPRingProg').style.strokeDashoffset=PCIRC*(1-n/ADV_SECS);}

function stopAllCd(){stopPCd();stopAdvPCd();}

function goToLobby(){
  const name=document.getElementById('playerName').value.trim();
  const err=document.getElementById('joinError');
  if(!name){err.textContent='اكتب اسمك أول';return;}
  myName=name;
  document.getElementById('lobbyGreet').textContent='اهلاً '+name+' 👋';
  document.getElementById('joinScreen').classList.remove('active');
  document.getElementById('lobbyScreen').classList.add('active');
  // request current players list
  if(ws&&ws.readyState===WebSocket.OPEN) {
    const roomId = new URLSearchParams(location.search).get('room') || '';
    ws.send(JSON.stringify({type:'get_players', roomId}));
  }
}

function updateLobby(players){
  const aList=players.filter(p=>p.team==='A'),bList=players.filter(p=>p.team==='B');
  const render=list=>list.length
    ?list.map(p=>`<div class="lobby-player"><div class="lobby-dot" style="background:${p.team==='A'?'var(--team-a)':'var(--team-b)'}"></div>${p.name}</div>`).join('')
    :'<div class="lobby-empty">فاضي</div>';
  document.getElementById('lobbyA').innerHTML=render(aList);
  document.getElementById('lobbyB').innerHTML=render(bList);
}

function selectTeam(t){myTeam=t;document.getElementById('btnTeamA').className=t==='A'?'team-btn selected-a':'team-btn';document.getElementById('btnTeamB').className=t==='B'?'team-btn selected-b':'team-btn';}

function joinGame(){
  const err=document.getElementById('lobbyError');
  if(!myTeam){err.textContent='اختر فريقك';return;}
  err.textContent='';
  if(!ws||ws.readyState!==WebSocket.OPEN){err.textContent='لم يتصل بعد، انتظر...';return;}
  const roomId = new URLSearchParams(location.search).get('room') || '';
  ws.send(JSON.stringify({type:'join_player',name:myName,team:myTeam,roomId}));
}

function buzz(){if(gameBlocked)return;ws.send(JSON.stringify({type:'buzz'}));if(navigator.vibrate)navigator.vibrate([100,50,100]);}

function setReady(){
  gameBlocked=false;stopAllCd();
  document.getElementById('buzzBtn').className=myTeam==='A'?'ready-a':'ready-b';
  document.getElementById('buzzBtn').textContent='اضغط!';
  const st=document.getElementById('buzzStatus');st.textContent='جاهز للإجابة؟';st.className='buzz-status';
}

function setBlocked(buzzer){
  gameBlocked=true;
  document.getElementById('buzzBtn').className='blocked';
  document.getElementById('buzzBtn').textContent='🔒';
  const st=document.getElementById('buzzStatus');
  st.textContent=buzzer?`ضغط: ${buzzer.name}`:'محجوب';st.className='buzz-status blocked';
}

function setWinner(){
  gameBlocked=true;
  document.getElementById('buzzBtn').className='winner';
  document.getElementById('buzzBtn').textContent='🎉 أنت الأول!';
  const st=document.getElementById('buzzStatus');st.textContent='⭐ أجب الآن!';st.className='buzz-status winner';
  if(navigator.vibrate)navigator.vibrate([200,100,200,100,300]);
}

function setAdvantageActive(){
  gameBlocked=false;
  document.getElementById('buzzBtn').className='advantage-active';
  document.getElementById('buzzBtn').textContent='⚡ اضغط!';
  const st=document.getElementById('buzzStatus');st.textContent='أفضلية لفريقك!';st.className='buzz-status advantage';
}

function setAdvantageBlocked(){
  gameBlocked=true;
  document.getElementById('buzzBtn').className='blocked';
  document.getElementById('buzzBtn').textContent='⏳';
  const st=document.getElementById('buzzStatus');st.textContent='أفضلية للمنافس';st.className='buzz-status blocked';
}

function connect(){
  ws=new WebSocket(WS_URL);
  ws.onopen=()=>{document.getElementById('connDot').classList.add('on');document.getElementById('connText').textContent='متصل';};
  ws.onclose=()=>{document.getElementById('connDot').classList.remove('on');document.getElementById('connText').textContent='انقطع';setTimeout(connect,2000);};
  ws.onmessage=e=>handle(JSON.parse(e.data));
}

function handle(m){
  switch(m.type){
    case 'joined':
      myId=m.id;myTeam=m.team;
      document.getElementById('displayName').textContent=m.name;
      const badge=document.getElementById('displayTeam');
      badge.textContent=m.team==='A'?'الفريق أ 🔵':'الفريق ب 🔴';
      badge.className='player-team-badge '+(m.team==='A'?'badge-a':'badge-b');
      document.getElementById('buzzBtn').className=myTeam==='A'?'ready-a':'ready-b';
      document.getElementById('joinScreen').classList.remove('active');
      document.getElementById('lobbyScreen').classList.remove('active');
      document.getElementById('gameScreen').classList.add('active');
      if(m.mode==='advantage'){
        if(m.advantageTeam===myTeam)setAdvantageActive();
        else setAdvantageBlocked();
        startAdvPCd();
      } else if(m.blocked)setBlocked(m.buzzer);
      break;
    case 'buzz_event':
      playBuzz();
      if(m.buzzer.id===myId){setWinner();startPCd();}
      else{setBlocked(m.buzzer);startPCd();}
      break;
    case 'advantage_start':
      stopAllCd();
      if(m.advantageTeam===myTeam){setAdvantageActive();}
      else{setAdvantageBlocked();}
      startAdvPCd();
      break;
    case 'advantage_end':
      stopAllCd();setReady();
      break;
    case 'reset':
      stopAllCd();setReady();
      break;
    case 'players_update':
      updateLobby(m.players);
      break;
    case 'buzz_denied':
      if(navigator.vibrate)navigator.vibrate(200);
      break;
    case 'session_ended':
    case 'host_session_ended':
      stopAllCd();
      document.getElementById('gameScreen').classList.remove('active');
      document.getElementById('kickedScreen').classList.add('active');
      document.querySelector('#kickedScreen .kicked-icon').textContent = '⏰';
      document.querySelector('#kickedScreen .kicked-title').textContent = 'انتهت الجلسة';
      document.querySelector('#kickedScreen .kicked-sub').textContent = 'انتهت جلسة الهوست المجانية';
      break;
    case 'kicked':
      document.getElementById('gameScreen').classList.remove('active');
      document.getElementById('kickedScreen').classList.add('active');
      ws.close();
      break;
  }
}

window.onload=()=>connect();
</script>
</body>
</html>
