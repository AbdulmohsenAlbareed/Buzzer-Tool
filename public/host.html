<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أداة الزر — الهوست</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#0a0a12;--card:#13131f;--border:#2a2a40;--gold:#f5c842;--team-a:#3b82f6;--team-b:#ef4444;--green:#22c55e;--text:#e8e8f0;--muted:#6b6b8a;--buzz-glow:0 0 60px rgba(245,200,66,.5),0 0 120px rgba(245,200,66,.25);--adv-glow:0 0 60px rgba(168,85,247,.5),0 0 120px rgba(168,85,247,.2);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;background-image:radial-gradient(ellipse at 20% 0%,rgba(59,130,246,.07) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(239,68,68,.07) 0%,transparent 50%);}
.header{text-align:center;margin-bottom:20px;}
.logo{font-size:2.6rem;font-weight:900;letter-spacing:-2px;background:linear-gradient(135deg,var(--team-a),var(--gold),var(--team-b));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.subtitle{color:var(--muted);font-size:.85rem;margin-top:2px;}
.status-bar{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;background:var(--card);border-radius:12px;font-size:.85rem;color:var(--muted);margin-bottom:14px;}
.status-dot{width:8px;height:8px;border-radius:50%;background:#ef4444;transition:background .3s;}
.status-dot.connected{background:#22c55e;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.join-link{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center;margin-bottom:16px;}
.section-title{font-size:.75rem;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;}
.join-url{font-size:.85rem;color:var(--gold);word-break:break-all;margin-bottom:10px;}
.btns-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:8px;}
.btn-copy{background:transparent;border:1px solid var(--gold);color:var(--gold);font-family:'Tajawal',sans-serif;font-size:.82rem;padding:5px 12px;border-radius:8px;cursor:pointer;transition:all .2s;}
.btn-copy:hover{background:rgba(245,200,66,.1);}
.btn-qr{background:transparent;border:1px solid var(--team-a);color:var(--team-a);font-family:'Tajawal',sans-serif;font-size:.82rem;padding:5px 12px;border-radius:8px;cursor:pointer;transition:all .2s;}
.btn-qr:hover{background:rgba(59,130,246,.1);}
.btn-display{background:transparent;border:1px solid #a855f7;color:#a855f7;font-family:'Tajawal',sans-serif;font-size:.82rem;padding:5px 12px;border-radius:8px;cursor:pointer;transition:all .2s;}
.btn-display:hover{background:rgba(168,85,247,.1);}
.qr-wrap{display:none;flex-direction:column;align-items:center;gap:8px;margin-top:12px;}
.qr-wrap.show{display:flex;}
.qr-label{font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:1px;}
#qrCanvas{border-radius:12px;background:white;padding:10px;display:inline-block;}
#qrCanvas img{display:block;}
.host-link-section{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.host-url{font-size:.78rem;color:var(--muted);word-break:break-all;margin-bottom:6px;}
.buzz-zone{background:var(--card);border:2px solid var(--border);border-radius:22px;padding:28px;text-align:center;margin-bottom:16px;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all .4s;}
.buzz-zone.active{border-color:var(--gold);box-shadow:var(--buzz-glow);animation:pulse 1.5s infinite;}
.buzz-zone.advantage-mode{border-color:#a855f7;box-shadow:var(--adv-glow);animation:pulse-adv 1.5s infinite;}
@keyframes pulse{0%,100%{box-shadow:var(--buzz-glow)}50%{box-shadow:0 0 25px rgba(245,200,66,.25)}}
@keyframes pulse-adv{0%,100%{box-shadow:var(--adv-glow)}50%{box-shadow:0 0 25px rgba(168,85,247,.2)}}
.buzz-idle{color:var(--muted);font-size:1rem;}
.buzz-icon-idle{font-size:2.5rem;margin-bottom:6px;opacity:.3;}
.buzz-active{display:none;width:100%;}
.buzz-zone.active .buzz-idle,.buzz-zone.advantage-mode .buzz-idle{display:none;}
.buzz-zone.active .buzz-active,.buzz-zone.advantage-mode .buzz-active{display:block;}
.buzz-normal-content{display:none;}
.buzz-adv-content{display:none;}
.buzz-zone.active .buzz-normal-content{display:block;}
.buzz-zone.advantage-mode .buzz-adv-content{display:block;}
.buzz-crown{font-size:1.8rem;margin-bottom:2px;}
.buzz-player-name{font-size:2.2rem;font-weight:900;color:var(--gold);margin-bottom:4px;}
.buzz-team-badge{display:inline-block;padding:3px 14px;border-radius:20px;font-size:.85rem;font-weight:700;margin-bottom:16px;}
.badge-a{background:rgba(59,130,246,.2);color:var(--team-a);border:1px solid var(--team-a);}
.badge-b{background:rgba(239,68,68,.2);color:var(--team-b);border:1px solid var(--team-b);}
.cd-wrap{display:none;flex-direction:column;align-items:center;margin-bottom:12px;}
.cd-wrap.show{display:flex;}
.cd-label{font-size:.7rem;font-weight:700;color:var(--muted);letter-spacing:1px;margin-bottom:6px;}
.cd-ring{position:relative;width:72px;height:72px;}
.cd-ring svg{transform:rotate(-90deg);}
.cd-ring circle{fill:none;stroke-width:6;}
.ring-bg{stroke:var(--border);}
.ring-prog{stroke:var(--gold);stroke-linecap:round;stroke-dasharray:188;stroke-dashoffset:0;transition:stroke-dashoffset .1s linear,stroke .3s;}
.ring-prog.urgent{stroke:#ef4444;}
.cd-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:900;color:var(--gold);}
.cd-num.urgent{color:#ef4444;}
.adv-cd-wrap{display:none;flex-direction:column;align-items:center;margin-bottom:14px;}
.adv-cd-wrap.show{display:flex;}
.adv-ring-prog{stroke:#a855f7;stroke-linecap:round;stroke-dasharray:188;stroke-dashoffset:0;transition:stroke-dashoffset .1s linear;}
.adv-cd-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:900;color:#a855f7;}
.action-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:4px;}
.btn-reset{background:linear-gradient(135deg,var(--green),#16a34a);border:none;color:white;font-family:'Tajawal',sans-serif;font-size:1.1rem;font-weight:900;padding:13px 28px;border-radius:14px;cursor:pointer;transition:all .2s;box-shadow:0 4px 18px rgba(34,197,94,.3);}
.btn-reset:hover{transform:scale(1.03);}
.btn-advantage{background:linear-gradient(135deg,#a855f7,#7c3aed);border:none;color:white;font-family:'Tajawal',sans-serif;font-size:1.1rem;font-weight:900;padding:13px 28px;border-radius:14px;cursor:pointer;transition:all .2s;box-shadow:0 4px 18px rgba(168,85,247,.35);}
.btn-advantage:hover{transform:scale(1.03);}
.adv-info{font-size:1rem;font-weight:700;color:#a855f7;margin-bottom:6px;}
.adv-blocked-label{font-size:.8rem;color:var(--muted);margin-bottom:10px;}
.players-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.player-col{background:var(--card);border:2px solid var(--border);border-radius:16px;padding:14px;}
.team-a-col{border-color:rgba(59,130,246,.3);}
.team-b-col{border-color:rgba(239,68,68,.3);}
.player-col-title{font-size:.72rem;font-weight:700;letter-spacing:2px;margin-bottom:10px;}
.team-a-col .player-col-title{color:var(--team-a);}
.team-b-col .player-col-title{color:var(--team-b);}
.player-chip{background:rgba(255,255,255,.04);border-radius:8px;padding:7px 10px;margin-bottom:6px;font-size:.88rem;display:flex;align-items:center;gap:8px;justify-content:space-between;}
.player-left{display:flex;align-items:center;gap:8px;}
.player-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.team-a-dot{background:var(--team-a);}
.team-b-dot{background:var(--team-b);}
.btn-kick{background:transparent;border:1px solid rgba(239,68,68,.4);color:rgba(239,68,68,.7);font-family:'Tajawal',sans-serif;font-size:.72rem;padding:3px 8px;border-radius:6px;cursor:pointer;transition:all .2s;flex-shrink:0;}
.btn-kick:hover{background:rgba(239,68,68,.15);color:var(--team-b);}
.no-players{color:var(--muted);font-size:.8rem;text-align:center;padding:10px;}
.btns-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}
.btn-qr{background:transparent;border:1px solid var(--team-a);color:var(--team-a);font-family:'Tajawal',sans-serif;font-size:.85rem;padding:5px 14px;border-radius:8px;cursor:pointer;transition:all .2s;}
.btn-qr:hover{background:rgba(59,130,246,.1);}
.btn-display{background:transparent;border:1px solid #a855f7;color:#a855f7;font-family:'Tajawal',sans-serif;font-size:.85rem;padding:5px 14px;border-radius:8px;cursor:pointer;transition:all .2s;}
.btn-display:hover{background:rgba(168,85,247,.1);}
.btn-copy{background:transparent;border:1px solid var(--gold);color:var(--gold);font-family:'Tajawal',sans-serif;font-size:.85rem;padding:5px 14px;border-radius:8px;cursor:pointer;transition:all .2s;}
.btn-copy:hover{background:rgba(245,200,66,.1);}
.qr-wrap{display:none;flex-direction:column;align-items:center;gap:8px;margin:10px 0;}
.qr-wrap.show{display:flex;}
.qr-label{font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:1px;}
#qrCanvas{border-radius:12px;background:white;padding:10px;display:inline-block;}
#qrCanvas img{display:block;}
.host-link-section{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);text-align:center;}
.host-url{font-size:.78rem;color:var(--muted);word-break:break-all;margin:4px 0 8px;}
</style>
</head>
<body>

<div class="header">
  <div class="logo">أداة الزر</div>
  <div class="subtitle">لوحة الهوست</div>
</div>

<div class="status-bar">
  <div class="status-dot" id="statusDot"></div>
  <span id="statusText">جاري الاتصال...</span>
</div>

<div class="join-link">
  <div class="section-title">رابط اللاعبين</div>
  <div class="join-url" id="joinUrl">—</div>
  <div class="btns-row">
    <button class="btn-copy" onclick="copyLink()">نسخ الرابط</button>
    <button class="btn-qr" onclick="toggleQR()">📷 QR Code</button>
    <button class="btn-display" onclick="openDisplay()">🖥️ شاشة العرض</button>
  </div>
  <div class="qr-wrap" id="qrWrap">
    <div class="qr-label">امسح للدخول مباشرة</div>
    <div id="qrCanvas"></div>
  </div>
  <div class="host-link-section">
    <div class="qr-label" style="margin-bottom:4px;">رابط الهوست — افتحه على جهاز ثاني</div>
    <div class="host-url" id="hostUrl">—</div>
    <button class="btn-copy" style="font-size:.75rem;" onclick="copyHostLink()">نسخ رابط الهوست</button>
  </div>
</div>

<div class="section-title" style="text-align:center;margin-bottom:10px;">منطقة البزر</div>
<div class="buzz-zone" id="buzzZone">
  <div class="buzz-idle"><div class="buzz-icon-idle">🔔</div><div>في انتظار اللاعبين...</div></div>
  <div class="buzz-active">
    <div class="buzz-normal-content">
      <div class="buzz-crown">👑</div>
      <div class="buzz-player-name" id="buzzerName">—</div>
      <div class="buzz-team-badge" id="buzzerTeam">—</div>
      <div class="cd-wrap" id="cdWrap">
        <div class="cd-label">وقت الإجابة</div>
        <div class="cd-ring">
          <svg width="72" height="72" viewBox="0 0 72 72"><circle class="ring-bg" cx="36" cy="36" r="30"/><circle class="ring-prog" id="ringProg" cx="36" cy="36" r="30"/></svg>
          <div class="cd-num" id="cdNum">3</div>
        </div>
      </div>
      <div class="action-btns">
        <button class="btn-advantage" onclick="giveAdvantage()">⚡ أفضلية للمنافس</button>
        <button class="btn-reset" onclick="sendReset()">🔄 ريست</button>
      </div>
    </div>
    <div class="buzz-adv-content">
      <div class="adv-info" id="advInfo">—</div>
      <div class="adv-blocked-label" id="advBlockedLabel">—</div>
      <div class="adv-cd-wrap show" id="advCdWrap">
        <div class="cd-label" style="color:#a855f7;">الوقت المتبقي</div>
        <div class="cd-ring">
          <svg width="72" height="72" viewBox="0 0 72 72"><circle class="ring-bg" cx="36" cy="36" r="30"/><circle class="adv-ring-prog" id="advRingProg" cx="36" cy="36" r="30"/></svg>
          <div class="adv-cd-num" id="advCdNum">10</div>
        </div>
      </div>
      <div class="action-btns"><button class="btn-reset" onclick="sendReset()">🔄 ريست</button></div>
    </div>
  </div>
</div>

<div class="section-title" style="margin-bottom:10px;">اللاعبون</div>
<div class="players-grid">
  <div class="player-col team-a-col"><div class="player-col-title">الفريق أ</div><div id="playersA"><div class="no-players">لا أحد بعد</div></div></div>
  <div class="player-col team-b-col"><div class="player-col-title">الفريق ب</div><div id="playersB"><div class="no-players">لا أحد بعد</div></div></div>
</div>

<script>
const WS_URL = location.protocol==='https:' ? `wss://${location.host}` : `ws://${location.host}`;
const urlRoomId = new URLSearchParams(location.search).get('room') || '';
let ws, roomId = '';
const CD_SECS=3, ADV_SECS=10, CIRC=188;
let cdInt=null, advInt=null, audioCtx, qrGenerated=false;

// ─── Sound ───
function getCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playBuzz(){try{const c=getCtx(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='square';o.frequency.setValueAtTime(900,c.currentTime);o.frequency.exponentialRampToValueAtTime(200,c.currentTime+.35);g.gain.setValueAtTime(.35,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.4);o.start();o.stop(c.currentTime+.4);}catch(e){}}
function playTick(n){try{const c=getCtx(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=n===1?1200:880;g.gain.setValueAtTime(.15,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.08);o.start();o.stop(c.currentTime+.08);}catch(e){}}
function playTimeup(){try{const c=getCtx();[400,300,200].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sawtooth';o.frequency.value=f;g.gain.setValueAtTime(.2,c.currentTime+i*.12);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+i*.12+.1);o.start(c.currentTime+i*.12);o.stop(c.currentTime+i*.12+.1);});}catch(e){}}

// ─── Countdowns ───
function startCd(){stopCd();let r=CD_SECS;document.getElementById('cdWrap').classList.add('show');updateCd(r);cdInt=setInterval(()=>{r--;r<=0?(stopCd(),playTimeup(),updateCd(0)):(updateCd(r),playTick(r));},1000);}
function stopCd(){if(cdInt){clearInterval(cdInt);cdInt=null;}document.getElementById('cdWrap').classList.remove('show');}
function updateCd(n){const num=document.getElementById('cdNum'),ring=document.getElementById('ringProg');ring.style.strokeDashoffset=CIRC*(1-n/CD_SECS);num.textContent=n;const u=n<=1;num.classList.toggle('urgent',u);ring.classList.toggle('urgent',u);}
function startAdvCd(){stopAdvCd();let r=ADV_SECS;document.getElementById('advCdWrap').classList.add('show');updateAdvCd(r);advInt=setInterval(()=>{r--;r<=0?(stopAdvCd(),updateAdvCd(0)):(updateAdvCd(r),r<=3&&playTick(r));},1000);}
function stopAdvCd(){if(advInt){clearInterval(advInt);advInt=null;}}
function updateAdvCd(n){document.getElementById('advCdNum').textContent=n;document.getElementById('advRingProg').style.strokeDashoffset=CIRC*(1-n/ADV_SECS);}

// ─── UI ───
function showBuzz(b){
  document.getElementById('buzzerName').textContent=b.name;
  const badge=document.getElementById('buzzerTeam');
  badge.textContent=b.team==='A'?'الفريق أ 🔵':'الفريق ب 🔴';
  badge.className='buzz-team-badge '+(b.team==='A'?'badge-a':'badge-b');
  document.getElementById('buzzZone').classList.remove('advantage-mode');
  document.getElementById('buzzZone').classList.add('active');
  startCd();
}
function showAdvantage(adv,blk){
  stopCd();
  document.getElementById('advInfo').textContent=(adv==='A'?'الفريق أ 🔵':'الفريق ب 🔴')+' لديه أفضلية';
  document.getElementById('advBlockedLabel').textContent=(blk==='A'?'الفريق أ 🔵':'الفريق ب 🔴')+' — محجوب';
  document.getElementById('buzzZone').classList.remove('active');
  document.getElementById('buzzZone').classList.add('advantage-mode');
  startAdvCd();
}
function clearBuzz(){stopCd();stopAdvCd();document.getElementById('buzzZone').classList.remove('active','advantage-mode');}
function updatePlayers(players){
  const a=players.filter(p=>p.team==='A'), b=players.filter(p=>p.team==='B');
  const r=list=>list.length?list.map(p=>`<div class="player-chip"><div class="player-left"><div class="player-dot ${p.team==='A'?'team-a-dot':'team-b-dot'}"></div>${p.name}</div><button class="btn-kick" onclick="kickPlayer('${p.id}')">طرد</button></div>`).join(''):'<div class="no-players">لا أحد بعد</div>';
  document.getElementById('playersA').innerHTML=r(a);
  document.getElementById('playersB').innerHTML=r(b);
}
function updateLinks(){
  const base=`${location.protocol}//${location.host}`;
  document.getElementById('joinUrl').textContent=`${base}/player.html?room=${roomId}`;
  document.getElementById('hostUrl').textContent=`${base}/host.html?room=${roomId}`;
}

// ─── QR ───
function toggleQR(){
  const wrap=document.getElementById('qrWrap');
  wrap.classList.toggle('show');
  if(wrap.classList.contains('show') && !qrGenerated){
    const url=`${location.protocol}//${location.host}/player.html?room=${roomId}`;
    new QRCode(document.getElementById('qrCanvas'),{text:url,width:180,height:180,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M});
    qrGenerated=true;
  }
}

// ─── Actions ───
function sendReset(){ws.send(JSON.stringify({type:'reset'}));}
function giveAdvantage(){ws.send(JSON.stringify({type:'advantage'}));}
function kickPlayer(id){if(confirm('تبي تطرد هذا اللاعب؟'))ws.send(JSON.stringify({type:'kick',playerId:id}));}
function copyLink(){navigator.clipboard.writeText(`${location.protocol}//${location.host}/player.html?room=${roomId}`).then(()=>{const b=event.target;b.textContent='✓ تم';setTimeout(()=>b.textContent='نسخ الرابط',2000);});}
function copyHostLink(){navigator.clipboard.writeText(`${location.protocol}//${location.host}/host.html?room=${roomId}`).then(()=>{const b=event.target;b.textContent='✓ تم';setTimeout(()=>b.textContent='نسخ رابط الهوست',2000);});}
function openDisplay(){window.open(`/display.html?room=${roomId}`,'_blank');}

// ─── WebSocket ───
function connect(){
  ws=new WebSocket(WS_URL);
  ws.onopen=()=>{
    ws.send(JSON.stringify({type:'join_host', roomId: urlRoomId||undefined}));
    document.getElementById('statusDot').classList.add('connected');
    document.getElementById('statusText').textContent='متصل ✓';
  };
  ws.onclose=()=>{
    document.getElementById('statusDot').classList.remove('connected');
    document.getElementById('statusText').textContent='انقطع — جاري إعادة الاتصال...';
    setTimeout(connect,2000);
  };
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    switch(m.type){
      case 'state':
        if(m.roomId){roomId=m.roomId; updateLinks();}
        updatePlayers(m.players);
        if(m.mode==='advantage') showAdvantage(m.advantageTeam, m.advantageTeam==='A'?'B':'A');
        else if(m.buzzer) showBuzz(m.buzzer);
        break;
      case 'buzz_event': showBuzz(m.buzzer); playBuzz(); break;
      case 'advantage_start': showAdvantage(m.advantageTeam, m.blockedTeam); break;
      case 'advantage_end': clearBuzz(); break;
      case 'reset': clearBuzz(); break;
      case 'players_update': updatePlayers(m.players); break;
    }
  };
}
window.onload=()=>connect();
</script>
</body>
</html>
