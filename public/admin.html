<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أداة الزر — الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a12;--card:#13131f;--border:#2a2a40;--gold:#f5c842;--a:#3b82f6;--b:#ef4444;--green:#22c55e;--purple:#a855f7;--text:#e8e8f0;--muted:#6b6b8a;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;}
.logo{font-size:2rem;font-weight:900;background:linear-gradient(135deg,var(--a),var(--gold),var(--b));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr;}}
.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;text-align:center;}
.stat-n{font-size:2.2rem;font-weight:900;}
.stat-l{font-size:.72rem;color:var(--muted);letter-spacing:1px;margin-top:2px;}
.sec-title{font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:20px;font-size:.85rem;}
th{background:rgba(255,255,255,.04);padding:10px 14px;text-align:right;font-size:.72rem;color:var(--muted);letter-spacing:1px;}
td{padding:10px 14px;border-top:1px solid var(--border);}
.bp{padding:2px 8px;border-radius:20px;font-size:.72rem;font-weight:700;}
.bp.pro{background:rgba(245,200,66,.15);color:var(--gold);border:1px solid rgba(245,200,66,.3);}
.bp.free{background:rgba(107,107,138,.1);color:var(--muted);border:1px solid var(--border);}
.bp.session{background:rgba(168,85,247,.15);color:var(--purple);border:1px solid rgba(168,85,247,.3);}
#loginWrap{max-width:320px;margin:100px auto;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;}
input{width:100%;background:rgba(255,255,255,.05);border:2px solid var(--border);border-radius:10px;padding:11px 14px;font-family:'Tajawal',sans-serif;font-size:1rem;color:var(--text);outline:none;margin-bottom:12px;}
input:focus{border-color:var(--gold);}
.btn{background:linear-gradient(135deg,var(--gold),#e6b800);border:none;color:#0a0a12;font-family:'Tajawal',sans-serif;font-size:1rem;font-weight:900;padding:12px;border-radius:12px;cursor:pointer;width:100%;}
</style>
</head>
<body>

<div id="loginWrap">
  <div class="logo" style="text-align:center;margin-bottom:16px;">أداة الزر</div>
  <div style="color:var(--muted);font-size:.85rem;text-align:center;margin-bottom:18px;">لوحة الإدارة</div>
  <input type="password" id="sec" placeholder="كلمة سر الإدارة" onkeydown="if(event.key==='Enter')load()">
  <button class="btn" onclick="load()">دخول</button>
  <div id="lerr" style="color:var(--b);font-size:.8rem;text-align:center;margin-top:8px;"></div>
</div>

<div id="dash" style="display:none">
  <div class="header">
    <div class="logo">أداة الزر — الإدارة</div>
    <div style="color:var(--muted);font-size:.8rem;" id="updated"></div>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-n" id="sTotal">—</div><div class="stat-l">المستخدمون</div></div>
    <div class="stat"><div class="stat-n" style="color:var(--gold)" id="sPro">—</div><div class="stat-l">مشتركو Pro</div></div>
    <div class="stat"><div class="stat-n" style="color:var(--purple)" id="sSession">—</div><div class="stat-l">مشتريو جلسات</div></div>
    <div class="stat"><div class="stat-n" style="color:var(--green)" id="sRev">—</div><div class="stat-l">دخل الشهر (ريال)</div></div>
  </div>
  <div class="sec-title">المستخدمون</div>
  <table>
    <thead><tr><th>#</th><th>الاسم</th><th>التواصل</th><th>الباقة</th><th>الجلسات</th><th>رصيد جلسات</th><th>تاريخ التسجيل</th></tr></thead>
    <tbody id="tUsers"></tbody>
  </table>
  <div class="sec-title">المدفوعات</div>
  <table>
    <thead><tr><th>#</th><th>المستخدم</th><th>الباقة</th><th>المبلغ</th><th>التاريخ</th></tr></thead>
    <tbody id="tPay"></tbody>
  </table>
</div>

<script>
let sec='';
async function load(){
  sec=document.getElementById('sec').value;
  const r=await fetch('/api/admin/stats',{headers:{'x-admin-secret':sec}});
  if(r.status===401){document.getElementById('lerr').textContent='كلمة السر غير صحيحة';return;}
  const d=await r.json();
  document.getElementById('loginWrap').style.display='none';
  document.getElementById('dash').style.display='block';
  render(d);
  setInterval(async()=>{const r2=await fetch('/api/admin/stats',{headers:{'x-admin-secret':sec}});render(await r2.json());},20000);
}
function render(d){
  document.getElementById('updated').textContent='آخر تحديث '+new Date().toLocaleTimeString('ar');
  document.getElementById('sTotal').textContent=d.total_users;
  document.getElementById('sPro').textContent=d.pro_users;
  document.getElementById('sSession').textContent=d.users.filter(u=>u.session_credits>0).length;
  document.getElementById('sRev').textContent=d.monthly_revenue.toLocaleString();
  document.getElementById('tUsers').innerHTML=d.users.map((u,i)=>`
    <tr><td>${i+1}</td><td>${u.name||'—'}</td><td style="direction:ltr;text-align:right;font-size:.78rem">${u.email||u.phone||'—'}</td>
    <td><span class="bp ${u.plan}">${u.plan==='pro'?'Pro ⭐':u.plan==='session'?'جلسة':'مجاني'}</span></td>
    <td>${u.plan==='pro'?'∞':u.sessions_used+'/2'}</td>
    <td>${u.session_credits||0}</td>
    <td>${new Date(u.created_at*1000).toLocaleDateString('ar')}</td></tr>`).join('');
  document.getElementById('tPay').innerHTML=d.payments.map((p,i)=>`
    <tr><td>${i+1}</td><td>${p.user_name||p.user_id}</td>
    <td><span class="bp ${p.plan}">${p.plan==='pro'?'Pro ⭐':'جلسة'}</span></td>
    <td style="color:var(--green)">${(p.amount/100).toFixed(0)} ريال</td>
    <td>${new Date(p.created_at*1000).toLocaleDateString('ar')}</td></tr>`).join('');
}
</script>
</body>
</html>
