<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أداة الزر — شاشة العرض</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a12;
  --team-a:#3b82f6;
  --team-b:#ef4444;
  --gold:#f5c842;
  --muted:#6b6b8a;
  --text:#e8e8f0;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;
  font-family:'Tajawal',sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}

/* ─── IDLE STATE ─── */
#idleScreen{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:var(--bg);
  transition:opacity .5s;
}
.idle-logo{
  font-size:5rem;font-weight:900;letter-spacing:-3px;
  background:linear-gradient(135deg,var(--team-a),var(--gold),var(--team-b));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:16px;
}
.idle-sub{color:var(--muted);font-size:1.4rem;}
.idle-pulse{
  width:20px;height:20px;border-radius:50%;
  background:var(--gold);margin-top:40px;
  animation:idlePulse 2s infinite;
}
@keyframes idlePulse{
  0%,100%{transform:scale(1);opacity:.6;}
  50%{transform:scale(1.6);opacity:1;}
}

/* ─── BUZZ STATE ─── */
#buzzScreen{
  position:fixed;inset:0;
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  transition:opacity .3s;
}
#buzzScreen.team-a{background:radial-gradient(ellipse at center, rgba(59,130,246,.15) 0%, var(--bg) 70%);}
#buzzScreen.team-b{background:radial-gradient(ellipse at center, rgba(239,68,68,.15) 0%, var(--bg) 70%);}

.buzz-crown{font-size:5rem;margin-bottom:8px;animation:popIn .3s cubic-bezier(.175,.885,.32,1.275);}
.buzz-name{
  font-size:10vw;font-weight:900;
  line-height:1;text-align:center;
  animation:popIn .35s cubic-bezier(.175,.885,.32,1.275);
  margin-bottom:20px;
}
.buzz-name.team-a{color:var(--team-a);}
.buzz-name.team-b{color:var(--team-b);}

.buzz-team-badge{
  display:inline-block;padding:8px 28px;border-radius:40px;
  font-size:1.8rem;font-weight:700;margin-bottom:40px;
  animation:fadeUp .4s ease;
}
.badge-a{background:rgba(59,130,246,.2);color:var(--team-a);border:2px solid var(--team-a);}
.badge-b{background:rgba(239,68,68,.2);color:var(--team-b);border:2px solid var(--team-b);}

/* countdown ring */
.cd-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;}
.cd-label{font-size:1rem;color:var(--muted);font-weight:700;letter-spacing:2px;}
.cd-ring{position:relative;width:120px;height:120px;}
.cd-ring svg{transform:rotate(-90deg);}
.cd-ring circle{fill:none;stroke-width:8;}
.ring-bg{stroke:#2a2a40;}
.ring-prog{
  stroke:var(--gold);stroke-linecap:round;
  stroke-dasharray:345;stroke-dashoffset:0;
  transition:stroke-dashoffset .1s linear,stroke .3s;
}
.ring-prog.urgent{stroke:#ef4444;}
.cd-num{
  position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;
  font-size:3rem;font-weight:900;color:var(--gold);
}
.cd-num.urgent{color:#ef4444;}

/* advantage state */
#advScreen{
  position:fixed;inset:0;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(168,85,247,.15) 0%,var(--bg) 70%);
}
.adv-icon{font-size:5rem;margin-bottom:12px;animation:popIn .3s ease;}
.adv-title{font-size:4rem;font-weight:900;color:#a855f7;margin-bottom:8px;animation:popIn .35s ease;}
.adv-sub{font-size:1.6rem;color:var(--muted);margin-bottom:40px;animation:fadeUp .4s ease;}
.adv-ring-prog{
  stroke:#a855f7;stroke-linecap:round;
  stroke-dasharray:345;stroke-dashoffset:0;
  transition:stroke-dashoffset .1s linear;
}
.adv-cd-num{
  position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;
  font-size:3rem;font-weight:900;color:#a855f7;
}

@keyframes popIn{
  0%{transform:scale(.5);opacity:0;}
  100%{transform:scale(1);opacity:1;}
}
@keyframes fadeUp{
  0%{transform:translateY(20px);opacity:0;}
  100%{transform:translateY(0);opacity:1;}
}

/* glow flash on buzz */
.flash-overlay{
  position:fixed;inset:0;pointer-events:none;
  opacity:0;transition:opacity .1s;
}
.flash-overlay.flash-a{background:rgba(59,130,246,.3);}
.flash-overlay.flash-b{background:rgba(239,68,68,.3);}
.flash-overlay.show{opacity:1;}

/* conn dot */
.conn{position:fixed;bottom:16px;left:16px;display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);}
.conn-dot{width:8px;height:8px;border-radius:50%;background:#ef4444;}
.conn-dot.on{background:#22c55e;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>

<!-- Flash overlay -->
<div class="flash-overlay" id="flashOverlay"></div>

<!-- Idle -->
<div id="idleScreen">
  <div class="idle-logo">أداة الزر</div>
  <div class="idle-sub">في انتظار الجولة...</div>
  <div class="idle-pulse"></div>
</div>

<!-- Buzz -->
<div id="buzzScreen">
  <div class="buzz-crown">👑</div>
  <div class="buzz-name" id="buzzName">—</div>
  <div class="buzz-team-badge" id="buzzTeam">—</div>
  <div class="cd-wrap">
    <div class="cd-label">وقت الإجابة</div>
    <div class="cd-ring">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle class="ring-bg" cx="60" cy="60" r="55"/>
        <circle class="ring-prog" id="ringProg" cx="60" cy="60" r="55"/>
      </svg>
      <div class="cd-num" id="cdNum">3</div>
    </div>
  </div>
</div>

<!-- Advantage -->
<div id="advScreen">
  <div class="adv-icon">⚡</div>
  <div class="adv-title" id="advTitle">الفريق — لديه أفضلية</div>
  <div class="adv-sub" id="advSub">الفريق — محجوب</div>
  <div class="cd-wrap">
    <div class="cd-label" style="color:#a855f7;">الوقت المتبقي</div>
    <div class="cd-ring">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle class="ring-bg" cx="60" cy="60" r="55"/>
        <circle class="adv-ring-prog" id="advRingProg" cx="60" cy="60" r="55"/>
      </svg>
      <div class="adv-cd-num" id="advCdNum">10</div>
    </div>
  </div>
</div>

<!-- Conn status -->
<div class="conn">
  <div class="conn-dot" id="connDot"></div>
  <span id="connText">جاري الاتصال</span>
</div>

<script>
const WS_URL = location.protocol==='https:' ? `wss://${location.host}` : `ws://${location.host}`;
const roomId = new URLSearchParams(location.search).get('room') || '';
const CIRC = 345; // 2π*55
const CD_SECS = 3, ADV_SECS = 10;
let cdInt = null, advInt = null, ws;
let audioCtx;

function getCtx(){ if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function playBuzz(){
  try{
    const c=getCtx(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);o.type='square';
    o.frequency.setValueAtTime(900,c.currentTime);
    o.frequency.exponentialRampToValueAtTime(200,c.currentTime+.4);
    g.gain.setValueAtTime(.4,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.45);
    o.start();o.stop(c.currentTime+.45);
  }catch(e){}
}
function playTick(n){
  try{
    const c=getCtx(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);o.type='sine';
    o.frequency.value=n===1?1400:900;
    g.gain.setValueAtTime(.2,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.1);
    o.start();o.stop(c.currentTime+.1);
  }catch(e){}
}
function playTimeup(){
  try{
    const c=getCtx();
    [500,350,200].forEach((f,i)=>{
      const o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);o.type='sawtooth';o.frequency.value=f;
      g.gain.setValueAtTime(.25,c.currentTime+i*.13);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+i*.13+.12);
      o.start(c.currentTime+i*.13);o.stop(c.currentTime+i*.13+.12);
    });
  }catch(e){}
}

function flash(team){
  const el=document.getElementById('flashOverlay');
  el.className='flash-overlay flash-'+team+' show';
  setTimeout(()=>el.classList.remove('show'),150);
}

// ─── Countdown ───
function startCd(){
  stopCd(); let r=CD_SECS;
  updateCd(r);
  cdInt=setInterval(()=>{r--;if(r<=0){clearInterval(cdInt);cdInt=null;playTimeup();updateCd(0);}else{updateCd(r);playTick(r);}},1000);
}
function stopCd(){ if(cdInt){clearInterval(cdInt);cdInt=null;} }
function updateCd(n){
  document.getElementById('cdNum').textContent=n;
  document.getElementById('ringProg').style.strokeDashoffset=CIRC*(1-n/CD_SECS);
  const u=n<=1;
  document.getElementById('cdNum').classList.toggle('urgent',u);
  document.getElementById('ringProg').classList.toggle('urgent',u);
}

// ─── Advantage countdown ───
function startAdvCd(){
  stopAdvCd(); let r=ADV_SECS; updateAdvCd(r);
  advInt=setInterval(()=>{r--;if(r<=0){clearInterval(advInt);advInt=null;updateAdvCd(0);}else{updateAdvCd(r);if(r<=3)playTick(r);}},1000);
}
function stopAdvCd(){ if(advInt){clearInterval(advInt);advInt=null;} }
function updateAdvCd(n){
  document.getElementById('advCdNum').textContent=n;
  document.getElementById('advRingProg').style.strokeDashoffset=CIRC*(1-n/ADV_SECS);
}

// ─── Screens ───
function showIdle(){
  stopCd();stopAdvCd();
  document.getElementById('idleScreen').style.display='flex';
  document.getElementById('buzzScreen').style.display='none';
  document.getElementById('advScreen').style.display='none';
}
function showBuzz(b){
  document.getElementById('idleScreen').style.display='none';
  document.getElementById('advScreen').style.display='none';
  const bs=document.getElementById('buzzScreen');
  bs.style.display='flex';
  bs.className=b.team==='A'?'team-a':'team-b';
  document.getElementById('buzzName').textContent=b.name;
  document.getElementById('buzzName').className='buzz-name team-'+b.team.toLowerCase();
  const badge=document.getElementById('buzzTeam');
  badge.textContent=b.team==='A'?'الفريق أ 🔵':'الفريق ب 🔴';
  badge.className='buzz-team-badge badge-'+b.team.toLowerCase();
  flash(b.team.toLowerCase());
  startCd();
}
function showAdvantage(advTeam, blockedTeam){
  stopCd();
  document.getElementById('idleScreen').style.display='none';
  document.getElementById('buzzScreen').style.display='none';
  document.getElementById('advScreen').style.display='flex';
  document.getElementById('advTitle').textContent=(advTeam==='A'?'الفريق أ 🔵':'الفريق ب 🔴')+' لديه أفضلية';
  document.getElementById('advSub').textContent=(blockedTeam==='A'?'الفريق أ 🔵':'الفريق ب 🔴')+' — محجوب';
  startAdvCd();
}

// ─── WebSocket ───
function connect(){
  ws=new WebSocket(WS_URL);
  ws.onopen=()=>{
    // يسجل كـ display observer
    ws.send(JSON.stringify({type:'join_display',roomId}));
    document.getElementById('connDot').classList.add('on');
    document.getElementById('connText').textContent='متصل ✓';
  };
  ws.onclose=()=>{
    document.getElementById('connDot').classList.remove('on');
    document.getElementById('connText').textContent='انقطع — جاري الاتصال...';
    setTimeout(connect,2000);
  };
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    switch(m.type){
      case 'state':
        if(m.mode==='advantage') showAdvantage(m.advantageTeam, m.advantageTeam==='A'?'B':'A');
        else if(m.buzzer) showBuzz(m.buzzer);
        else showIdle();
        break;
      case 'buzz_event': showBuzz(m.buzzer); playBuzz(); break;
      case 'advantage_start': showAdvantage(m.advantageTeam, m.blockedTeam); break;
      case 'advantage_end': showIdle(); break;
      case 'reset': showIdle(); break;
    }
  };
}

window.onload=()=>connect();
</script>
</body>
</html>
